<html> 
    <head>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-gray-100 p-10 front-sans">
        <div class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-md">
            <h1 class="text-2xl font-bold text-gray-800 mb-4"> MY TASK </h1>
            <ul class="space-y-2">
                {% for task in tasks %}
                    <li class="p-3 bg-gray-50 rounded border border-gray-200">
                        {{ task.title }}
                    </li>
                {% endfor %}
            </ul>
        </div>
    </body>
</html>
